name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx vite build

      - name: Build executable
        run: npx electron-builder --win portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List output
        run: Get-ChildItem -Path release -Recurse -Force -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Token-Surveillance
          path: |
            release/**/*.exe
            release/**/*.zip
